    <script>
      // Suppress benign Vite dev-server WebSocket connection log noise in container preview environment
      (function() {
        const origError = console.error;
        const origWarn = console.warn;
        console.error = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('WebSocket') || args[0].includes('[vite]'))) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          if (args[0] && typeof args[0] === 'string' && (args[0].includes('WebSocket') || args[0].includes('[vite]'))) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();

      // Safe Storage Polyfills for sandboxed iframes and privacy-focused browsers
      (function() {
        function checkStorage(type) {
          try {
            const storage = window[type];
            if (!storage) return false;
            storage.setItem('__test_storage__', '1');
            storage.removeItem('__test_storage__');
            return true;
          } catch (e) {
            return false;
          }
        }

        if (!checkStorage('localStorage')) {
          console.warn("localStorage Access Denied. Polyfilling in-memory fallback.");
          const memoryStore = {};
          const mockStorage = {
            getItem: function(key) { return key in memoryStore ? memoryStore[key] : null; },
            setItem: function(key, value) { memoryStore[key] = String(value); },
            removeItem: function(key) { delete memoryStore[key]; },
            clear: function() { for (const k in memoryStore) delete memoryStore[k]; },
            key: function(index) { return Object.keys(memoryStore)[index] || null; },
            get length() { return Object.keys(memoryStore).length; }
          };
          Object.defineProperty(window, 'localStorage', {
            value: mockStorage,
            writable: true,
            configurable: true
          });
        }

        if (!checkStorage('sessionStorage')) {
          console.warn("sessionStorage Access Denied. Polyfilling in-memory fallback.");
          const memoryStore = {};
          const mockStorage = {
            getItem: function(key) { return key in memoryStore ? memoryStore[key] : null; },
            setItem: function(key, value) { memoryStore[key] = String(value); },
            removeItem: function(key) { delete memoryStore[key]; },
            clear: function() { for (const k in memoryStore) delete memoryStore[k]; },
            key: function(index) { return Object.keys(memoryStore)[index] || null; },
            get length() { return Object.keys(memoryStore).length; }
          };
          Object.defineProperty(window, 'sessionStorage', {
            value: mockStorage,
            writable: true,
            configurable: true
          });
        }
      })();
    </script>

      /* Instant Pre-Hydration Scientific Loading Screen */
      #xrd-initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #0f172a 0%, #020617 75%, #000000 100%);
        color: #f8fafc;
        z-index: 99999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        user-select: none;
      }
      .xrd-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 2.5rem;
        max-width: 440px;
        width: 90%;
      }
      .xrd-ring-container {
        position: relative;
        width: 100px;
        height: 100px;
        margin-bottom: 1.5rem;
      }
      .xrd-gonio-ring {
        width: 100%;
        height: 100%;
        will-change: transform;
      }
      .xrd-spin {
        transform-origin: 60px 60px;
        animation: xrdSpin 3.5s linear infinite;
      }
      .xrd-spin-rev {
        transform-origin: 60px 60px;
        animation: xrdSpinRev 5s linear infinite;
      }
      .xrd-pulse-node {
        transform-origin: 60px 60px;
        animation: xrdPulseNode 1.8s ease-in-out infinite;
      }
      .xrd-beam-glow {
        position: absolute;
        inset: 15%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(6, 182, 212, 0.1) 60%, transparent 80%);
        filter: blur(12px);
        animation: xrdBeamPulse 2s ease-in-out infinite alternate;
      }
      .xrd-splash-title {
        font-size: 1.75rem;
        font-weight: 900;
        letter-spacing: -0.035em;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 0.4rem 0;
        text-transform: uppercase;
      }
      .xrd-splash-badge {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: #94a3b8;
        margin: 0 0 1.75rem 0;
        text-transform: uppercase;
      }
      .xrd-bar-track {
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 1rem;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .xrd-bar-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, #6366f1, #06b6d4, #a855f7);
        border-radius: 9999px;
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
        animation: xrdScanBeam 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .xrd-splash-status {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.62rem;
        font-weight: 600;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        letter-spacing: 0.06em;
        color: #64748b;
      }
      .xrd-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #06b6d4;
        box-shadow: 0 0 8px #06b6d4;
        animation: xrdBlink 1s ease-in-out infinite alternate;
      }
      @keyframes xrdSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes xrdSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes xrdPulseNode {
        0%, 100% { transform: scale(0.9); opacity: 0.85; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 8px #6366f1); }
      }
      @keyframes xrdBeamPulse {
        0% { opacity: 0.4; transform: scale(0.85); }
        100% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes xrdScanBeam {
        0% { left: -45%; width: 35%; }
        50% { width: 55%; }
        100% { left: 105%; width: 35%; }
      }
      @keyframes xrdBlink {
        0% { opacity: 0.35; transform: scale(0.85); }
        100% { opacity: 1; transform: scale(1.2); }
      }
